name: Weekly scrape + retrain

on:
  schedule:
    # Mondays 04:00 UTC — after all weekend fixtures across the 8 competitions
    # have finished and FotMob has published player stats. The multi-season
    # history is NOT built here: run scripts/backfill.py locally once and
    # commit the database; this job only adds the current season's new matches.
    - cron: "0 4 * * 1"
  workflow_dispatch: {}       # lets the Streamlit app's "force retrain" button
  repository_dispatch:        # (or a manual GitHub Actions run) trigger this on demand
    types: [force-retrain]

jobs:
  scrape-and-retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch newly completed matches (FotMob)
        run: python scripts/run_weekly_scrape.py

      - name: Retrain models + run drift check
        run: python scripts/run_retrain.py

      - name: Generate this week's predictions
        run: python scripts/run_predict.py

      - name: Commit updated data, models, and predictions
        run: |
          git config user.name "football-shots-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/matches.db models/ logs/
          git diff --cached --quiet || git commit -m "Weekly retrain: $(date -u +'%Y-%m-%d')"
          git push
